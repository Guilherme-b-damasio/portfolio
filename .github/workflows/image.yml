name: Image

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Flux orders by the leading timestamp: a bare sha has no order.
          tags: |
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}}

      - name: Build date
        id: date
        run: echo "built_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      # Pull requests only prove the image builds; pushes to develop publish it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.date.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
