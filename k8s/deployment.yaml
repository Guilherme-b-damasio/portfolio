apiVersion: v1
kind: Namespace
metadata:
  name: portfolio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio
  labels: { app: portfolio }
spec:
  replicas: 1 # rate limit is in memory; raise together with a shared store
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: portfolio }
  template:
    metadata:
      labels: { app: portfolio }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # Read-only API access for the cluster panel (k8s/rbac.yaml); the token is rotated by the kubelet.
      serviceAccountName: portfolio
      automountServiceAccountToken: true
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: web
          image: ghcr.io/guilherme-b-damasio/portfolio:latest # TODO: your registry
          ports: [{ containerPort: 3000, name: http }]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: CLUSTER_NAMESPACES # must match the Roles in k8s/rbac.yaml
              value: portfolio
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: portfolio-secrets, key: anthropic-api-key, optional: true } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
  namespace: portfolio
spec:
  selector: { app: portfolio }
  ports: [{ port: 80, targetPort: http, name: http }]
---
# k3s ships Traefik as the ingress controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # cert-manager.io/cluster-issuer: letsencrypt  # TODO: match whatever devdek uses for TLS
spec:
  ingressClassName: traefik
  rules:
    - host: portfolio.example.com # TODO: your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: portfolio, port: { name: http } }
  tls:
    - hosts: [portfolio.example.com]
      secretName: portfolio-tls
